<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatherwise by Datapointe — Prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#F0EDE6; --ink:#16141D; --ink-2:#4A4756; --muted:#6E6A7A;
  --line:#E4E0D8; --brand:#5B3DF5; --brand-2:#7C63FF; --brand-soft:#ECE8FF; --accent:#FF6B3D; --accent-soft:#FFE9E1;
  --ok:#11845B; --ok-soft:#DDF5EA; --warn:#B57A00; --warn-soft:#FFF3D6; --danger:#D9363E; --danger-soft:#FDE3E4;
  --radius:18px; --radius-sm:12px; --shadow:0 1px 2px rgba(22,20,29,.06),0 8px 24px rgba(22,20,29,.06);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --display:'Fraunces',Georgia,serif;
  --fs:16px;
}
html.hc{ --bg:#000; --surface:#000; --surface-2:#111; --ink:#fff; --ink-2:#fff; --muted:#E6E6E6; --line:#fff;
  --brand:#FFE600; --brand-2:#FFE600; --brand-soft:#222; --accent:#00E5FF; --accent-soft:#111; --ok:#4DFF9A; --ok-soft:#002611;
  --warn:#FFD24D; --warn-soft:#261C00; --danger:#FF6B6B; --danger-soft:#2A0000; --shadow:none; }
html.hc .btn-primary{color:#000}
html.hc .card, html.hc .btn, html.hc .chip, html.hc input, html.hc select, html.hc textarea{border-color:#fff !important}
html.lg{ --fs:19px; }
html.rm *, html.rm *::before, html.rm *::after{ animation:none !important; transition:none !important; scroll-behavior:auto !important }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:var(--fs);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:99}
.skip:focus{left:8px}

/* Layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#15131C;color:#EDEBF5;padding:22px 16px;display:flex;flex-direction:column;gap:6px}
html.hc .side{background:#000;border-right:2px solid #fff}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;font-size:1.15em;letter-spacing:-.01em;color:inherit;text-decoration:none}
.logo small{display:block;font-weight:500;font-size:.62em;opacity:.65;letter-spacing:.04em}
.mark{width:36px;height:36px;border-radius:11px;background:conic-gradient(from 200deg,#FF6B3D,#5B3DF5,#18C9A8,#FF6B3D);display:grid;place-items:center;flex:none}
.mark i{width:14px;height:14px;border-radius:50%;background:#15131C;display:block}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#CFCBE0;text-decoration:none;font-weight:600;font-size:.93em;min-height:44px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a[aria-current="page"]{background:rgba(124,99,255,.22);color:#fff}
html.hc .nav a[aria-current="page"]{background:#FFE600;color:#000}
.nav svg{width:20px;height:20px;flex:none}
.side .sep{height:1px;background:rgba(255,255,255,.1);margin:10px 4px}
.side .foot{margin-top:auto;font-size:.78em;opacity:.6;padding:8px}
main{min-width:0;padding:0 0 40px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .mlogo{display:none}
.top .spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{white-space:nowrap;border:0;background:transparent;color:var(--ink-2);font:inherit;font-weight:700;font-size:.82em;padding:7px 12px;border-radius:999px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
html.hc .seg button[aria-pressed="true"]{background:#FFE600;color:#000}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:.82em;border:0;cursor:pointer;font-family:inherit;min-height:36px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);font:inherit;font-weight:800}
.wrap{padding:26px 28px;max-width:1240px}
.bnav{display:none}

@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:10px 14px}
  .top .mlogo{display:flex}
  .wrap{padding:18px 14px}
  main{padding-bottom:96px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68em;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 0;min-height:48px;border-radius:12px}
  .bnav a svg{width:22px;height:22px}
  .bnav a[aria-current="page"]{color:var(--brand)}
  .bnav a.plus span.fab{width:48px;height:48px;border-radius:16px;background:var(--brand);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 20px rgba(91,61,245,.35)}
  html.hc .bnav a.plus span.fab{color:#000}
  .hide-m{display:none !important}
  .top{gap:6px}
  .seg button{padding:6px 9px;font-size:.76em}
  .pill{padding:6px 10px;font-size:.76em}
  .alertbar{flex-wrap:wrap}
  .alertbar .grow{flex-basis:calc(100% - 50px)}
}

/* Typography */
h1{font-size:1.75em;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em;font-weight:800}
h2{font-size:1.2em;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:1em;margin:0 0 6px}
.lead{color:var(--ink-2);margin:0 0 22px;max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:.85em}
.eyebrow{font-size:.74em;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}

/* Components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:.92em;cursor:pointer;text-decoration:none;transition:transform .12s, background .12s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-2)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-ghost{background:transparent;border-color:transparent}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-sm{min-height:36px;padding:6px 12px;font-size:.84em;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:.84em;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
html.hc .chip[aria-pressed="true"]{background:#FFE600;color:#000}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.74em;font-weight:800;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-danger{background:var(--danger-soft);color:var(--danger)}.b-brand{background:var(--brand-soft);color:var(--brand)}.b-accent{background:var(--accent-soft);color:var(--accent)}
label.f{display:block;font-weight:700;font-size:.86em;margin:0 0 6px}
.hint{font-size:.8em;color:var(--muted);margin-top:4px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=search],select,textarea{width:100%;min-height:46px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.95em}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--brand) 35%,transparent);border-color:var(--brand)}
.switch{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.switch:last-child{border-bottom:0}
.switch input{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked{background:var(--brand)}
.switch input:checked::after{left:21px}
.switch b{display:block;font-size:.93em}
.switch span{font-size:.82em;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;font:inherit;font-weight:700;font-size:.9em;color:var(--muted);padding:12px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;min-height:46px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.stat .v{font-size:1.7em;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-size:.8em;color:var(--muted);font-weight:600}
.stat .d{font-size:.78em;font-weight:700;color:var(--ok)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.82em;color:#fff;flex:none}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evcard{display:flex;flex-direction:column;overflow:hidden;padding:0;text-decoration:none;color:inherit;cursor:pointer;transition:transform .15s}
.evcard:hover{transform:translateY(-2px)}
.evcard .cov{aspect-ratio:16/9;overflow:hidden;background:var(--surface-2)}
.evcard .cov svg{width:100%;height:100%;display:block}
.evcard .body{padding:14px 16px 16px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.hero{background:linear-gradient(135deg,#1B1630 0%,#3A2A8C 55%,#FF6B3D 140%);color:#fff;border-radius:24px;padding:26px;position:relative;overflow:hidden;border:0}
html.hc .hero{background:#000;border:2px solid #fff}
.hero h1{font-size:1.9em}
.hero p{opacity:.85;max-width:52ch}
.hero .btn{border-color:rgba(255,255,255,.3)}
.hero .orb{position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 60%);pointer-events:none}
.toastbox{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,440px)}
@media (max-width:880px){.toastbox{bottom:100px}}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:.9em;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .25s ease;pointer-events:auto;width:100%}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-bg{position:fixed;inset:0;background:rgba(10,8,20,.55);z-index:80;display:grid;place-items:center;padding:16px;animation:tin .2s}
.modal{background:var(--surface);color:var(--ink);border-radius:22px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line)}
@media (max-width:560px){.modal-bg{place-items:end center;padding:0}.modal{border-radius:22px 22px 0 0;width:100%}}
.callout{border-radius:14px;padding:12px 14px;background:var(--brand-soft);color:var(--ink);font-size:.88em}
.callout.warn{background:var(--warn-soft)}
.callout.ok{background:var(--ok-soft)}
.callout.danger{background:var(--danger-soft)}
.proto{font-size:.72em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:.9em}
table.t th,table.t td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:.78em;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tablewrap{overflow-x:auto}
.kbd{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.06em}

/* Studio */
.drafts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.drafts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.draft{border-radius:14px;overflow:hidden;border:3px solid transparent;cursor:pointer;background:var(--surface-2);padding:0;aspect-ratio:4/5;display:block;width:100%}
.draft svg{width:100%;height:100%;display:block}
.draft[aria-pressed="true"]{border-color:var(--brand)}
.shimmer{background:linear-gradient(100deg,var(--surface-2) 30%,var(--surface) 50%,var(--surface-2) 70%);background-size:300% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.vid{position:relative;aspect-ratio:9/16;max-height:520px;border-radius:18px;overflow:hidden;background:#000;margin:0 auto;width:100%;max-width:300px}
.vid .bgimg{position:absolute;inset:-6%;animation:kb 7s ease-in-out infinite alternate}
.vid .bgimg svg{width:100%;height:100%}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-2%,-2%)}}
.vid .ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.65));display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff}
.vid .scene{font-family:var(--display);font-size:1.6em;line-height:1.1;animation:tin .4s}
.vid .cap{margin-top:10px;background:rgba(0,0,0,.78);padding:6px 10px;border-radius:8px;font-size:.85em;font-weight:600;align-self:flex-start}
.vid .prog{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px}
.vid .prog i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35)}
.vid .prog i.on{background:#fff}
.lock{display:grid;place-items:center;text-align:center;padding:30px}

/* Phone */
.phone{max-width:420px;margin:0 auto;background:var(--surface);border-radius:34px;border:1px solid var(--line);overflow:hidden;box-shadow:0 20px 60px rgba(22,20,29,.14)}
@media (max-width:560px){.phone{border-radius:20px;box-shadow:none}}
.phone .cov svg{width:100%;display:block}
.phone .pad{padding:20px}
.rsvpbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rsvpbtns button{min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
.rsvpbtns button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:44px;height:44px;border:0;background:var(--surface-2);font-size:1.2em;font-weight:800;cursor:pointer;color:var(--ink)}
.stepper output{min-width:44px;text-align:center;font-weight:800}
.paybtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font:inherit;cursor:pointer;color:var(--ink);min-height:56px}
.paybtn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.paybtn .lg{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:.75em;color:#fff;flex:none}
.ticket{border-radius:20px;background:linear-gradient(160deg,#1B1630,#3A2A8C);color:#fff;padding:20px;text-align:center}
.ticket .qrw{background:#fff;border-radius:14px;padding:12px;display:inline-block;margin:12px 0}

/* Check-in */
.viewfinder{position:relative;aspect-ratio:1/1;max-width:340px;margin:0 auto;border-radius:24px;background:radial-gradient(circle at 50% 40%,#2c2840,#0f0d16);overflow:hidden;display:grid;place-items:center}
.viewfinder .corners{position:absolute;inset:18%;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.viewfinder .corners::before,.viewfinder .corners::after{content:"";position:absolute;inset:0;border:4px solid #fff;border-radius:18px;clip-path:polygon(0 0,25% 0,25% 4px,4px 4px,4px 25%,0 25%,0 75%,4px 75%,4px calc(100% - 4px),25% calc(100% - 4px),25% 100%,75% 100%,75% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 75%,100% 75%,100% 25%,calc(100% - 4px) 25%,calc(100% - 4px) 4px,75% 4px,75% 0,100% 0,100% 100%,0 100%)}
.viewfinder .laser{position:absolute;left:20%;right:20%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:las 2s ease-in-out infinite}
@keyframes las{0%,100%{top:22%}50%{top:76%}}
.result{border-radius:18px;padding:18px;text-align:center;font-weight:700}
.result.ok{background:var(--ok-soft);color:var(--ok)}
.result.bad{background:var(--danger-soft);color:var(--danger)}
.result.warn{background:var(--warn-soft);color:var(--warn)}
.result .big{font-size:1.4em;font-weight:800}
.nfcring{width:150px;height:150px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);position:relative}
.nfcring::before,.nfcring::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid var(--brand);opacity:.0;animation:ring 2s ease-out infinite}
.nfcring::after{animation-delay:1s}
@keyframes ring{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.3);opacity:0}}

/* Safeguarding */
.alertbar{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--danger);color:#fff;margin-bottom:16px;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(217,54,62,.6)}to{box-shadow:0 0 0 10px rgba(217,54,62,0)}}
.alertbar .btn{background:#fff;color:var(--danger);border-color:#fff}
.tracking-on{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.82em;color:var(--ok)}
.tracking-on::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ok);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.map svg{width:100%;height:auto;display:block;border-radius:14px;background:var(--surface-2)}
.kid{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;width:100%;text-align:left;font:inherit;color:var(--ink)}
.kid[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.kid.alarm{border-color:var(--danger);background:var(--danger-soft)}
.table-viz{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}

/* ---------- Flyer generator (stand-in for AI image output) ---------- */
function wrapText(t, max){ const w=String(t).split(/\s+/); const lines=[]; let l=''; for(const x of w){ if((l+' '+x).trim().length>max){ if(l) lines.push(l); l=x; } else l=(l+' '+x).trim(); } if(l) lines.push(l); return lines.slice(0,4); }
function flyer(title, sub, seed, style, ratio='portrait'){
  const W=300, H = ratio==='wide'?169:375; const r=rng(seed+7); const h0=seed%360, h1=(h0+35+Math.floor(r()*90))%360;
  const lines = wrapText(title, ratio==='wide'?20:13); const fsz = ratio==='wide'?20:(lines.length>2?30:36);
  let bg='', deco='', tc='#fff', font="Fraunces, Georgia, serif", sc='rgba(255,255,255,.85)';
  if(style==='Elegant'){
    bg=`<defs><linearGradient id="g${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${h0} 45% 18%)"/><stop offset="1" stop-color="hsl(${h0} 55% 9%)"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#g${seed})"/>`;
    deco=`<rect x="14" y="14" width="${W-28}" height="${H-28}" fill="none" stroke="#D9B45A" stroke-width="1.2"/><rect x="20" y="20" width="${W-40}" height="${H-40}" fill="none" stroke="#D9B45A" stroke-width=".5"/>`+
      Array.from({length:6},(_,i)=>`<circle cx="${W/2}" cy="${H*0.2}" r="${10+i*7}" fill="none" stroke="#D9B45A" stroke-opacity="${.5-i*.07}"/>`).join('');
    tc='#F5E6C0'; sc='#D9B45A';
  } else if(style==='Vibrant'){
    bg=`<defs><linearGradient id="g${seed}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h0} 92% 58%)"/><stop offset="1" stop-color="hsl(${h1} 90% 52%)"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#g${seed})"/>`;
    deco=Array.from({length:9},()=>`<circle cx="${Math.floor(r()*W)}" cy="${Math.floor(r()*H)}" r="${8+Math.floor(r()*46)}" fill="hsl(${(h1+Math.floor(r()*120))%360} 95% 70%)" fill-opacity=".55"/>`).join('')+
      Array.from({length:14},()=>`<rect x="${Math.floor(r()*W)}" y="${Math.floor(r()*H*0.5)}" width="6" height="12" rx="2" transform="rotate(${Math.floor(r()*180)} ${Math.floor(r()*W)} ${Math.floor(r()*H)})" fill="#fff" fill-opacity=".8"/>`).join('');
    font="'Plus Jakarta Sans', sans-serif";
  } else if(style==='Minimal'){
    bg=`<rect width="${W}" height="${H}" fill="#F6F3EC"/>`;
    deco=`<rect x="0" y="0" width="${W}" height="${H*0.42}" fill="hsl(${h0} 70% 52%)"/><circle cx="${W*0.84}" cy="${H*0.16}" r="${ratio==='wide'?14:24}" fill="#16141D"/>`;
    tc='#16141D'; sc='#4A4756'; font="'Plus Jakarta Sans', sans-serif";
  } else { // Afro-pop
    bg=`<rect width="${W}" height="${H}" fill="hsl(${h0} 80% 40%)"/>`;
    const bands=[`hsl(${h1} 90% 55%)`,'#FFC93C','#16141D','#FFFFFF'];
    deco=Array.from({length:6},(_,i)=>{const y=i*(H/6); const c=bands[i%4]; return `<path d="M0 ${y} `+Array.from({length:11},(_,k)=>`L${k*30+15} ${y+(k%2?18:0)}`).join(' ')+` L${W} ${y} L${W} ${y+10} L0 ${y+10}Z" fill="${c}" fill-opacity=".55"/>`;}).join('')+
      Array.from({length:7},()=>{const x=Math.floor(r()*W),y=Math.floor(r()*H);return `<polygon points="${x},${y} ${x+18},${y+30} ${x-18},${y+30}" fill="#FFC93C" fill-opacity=".7"/>`;}).join('');
    font="'Plus Jakarta Sans', sans-serif";

  const subY = ty + lines.length*(fsz+4) + 10;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(title)} flyer">${bg}${deco}${text}<text x="${W/2}" y="${subY}" text-anchor="middle" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="${ratio==='wide'?10:12}" letter-spacing="2" fill="${sc}">${esc(String(sub).toUpperCase())}</text></svg>`;
}

/* ---------- Illustrative QR (not a scannable code in this prototype) ---------- */
function qr(text,size=150){
  const n=25, r=rng(hash(text)); let d='';
  const inF=(x,y)=>(x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){ if(!inF(x,y) && r()>.52) d+=`M${x} ${y}h1v1h-1z`; }
  const f=(x,y)=>`<path d="M${x} ${y}h7v7h-7zM${x+1} ${y+1}v5h5v-5z" fill-rule="evenodd"/><path d="M${x+2} ${y+2}h3v3h-3z"/>`;
  return `<svg viewBox="-1 -1 27 27" width="${size}" height="${size}" role="img" aria-label="QR code, reference ${esc(text)}"><rect x="-1" y="-1" width="27" height="27" fill="#fff"/><g fill="#16141D"><path d="${d}"/>${f(0,0)}${f(18,0)}${f(0,18)}</g></svg>`;
}

function wx(e){

  return {t:9,lo:4,rain:40,wind:18,cond:'Cloudy with drizzle',ico:'☁️'};
}
function advice(w,e){ const a=[]; const gentle=e.type==='Funeral / remembrance';
  if(w.rain>=40) a.push(gentle?'Rain is possible: an umbrella may help at the graveside.':'Rain likely: bring an umbrella.');
  if(w.t>=30) a.push('Hot: light clothing, and keep water close.');
  if(w.t<=8) a.push('Cold: wear a warm coat. A cloakroom is available.');
  if(w.wind>=30) a.push('Windy: hats and gele may need securing.');
  if(/Harmattan/.test(w.cond)) a.push('Dusty haze: sunglasses and lip balm help, and allow extra driving time.');

function orgTip(w){ return w.rain>=40?'Organiser tip: confirm canopies or an indoor backup.':w.t>=30?'Organiser tip: add water stations and fans.':w.wind>=30?'Organiser tip: secure outdoor decor and signage.':'No weather action needed.'; }
function routeWatch(e){ return e.region==='NG'?{from:'Lekki Phase 1',km:14.2,min:38,delay:20,inc:'Slow traffic on Ozumba Mbadiwe Avenue'}:{from:'Central Milton Keynes',km:6.1,min:14,delay:6,inc:'Roadworks on the A5 near the H8 junction'}; }
function leaveBy(e,r){ const m=/(\d\d):(\d\d)/.exec(e.time)||[0,'18','00']; let t=(+m[1])*60+(+m[2])-(r.min+r.delay+15); t=(t+1440)%1440; return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }

const ZONES=[
  {n:'Main Hall',x:20,y:20,w:330,h:230,ok:true,c:'#5B3DF5'},
  {n:'Kids Zone',x:370,y:20,w:210,h:150,ok:true,c:'#11845B'},
  {n:'Toilets',x:370,y:190,w:100,h:70,ok:true,c:'#0E7490'},
  {n:'Dining',x:20,y:270,w:330,h:90,ok:true,c:'#C2410C'},
  {n:'Exit A',x:490,y:190,w:90,h:70,ok:false,c:'#D9363E'},
  {n:'Lobby',x:370,y:280,w:210,h:80,ok:false,c:'#B57A00'}
];
const zoneAt=(x,y)=>ZONES.find(z=>x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h);
const ptIn=z=>({x:z.x+12+Math.random()*(z.w-24), y:z.y+12+Math.random()*(z.h-24)});
function initKids(){
  if(S.sg.kids.length) return;
  const names=[['Ada',7,'Mrs Ngozi Eze'],['Tobi',6,'Mr Bayo Adeyemi'],['Lily',5,'Ms Hannah Clarke'],['Zara',8,'Mr Musa Ibrahim'],['Leo',4,'Mrs Grace Taylor'],['Kamsi',7,'Dr Chidi Okafor'],['Noah',6,'Mr Tom Brown'],['Ife',5,'Mrs Funke Balogun']];
  S.sg.kids=names.map(([n,a,g],i)=>{const z=ZONES[i%3===0?1:i%3===1?0:3]; const p=ptIn(z); const t=ptIn(z); return {id:'k'+i,name:n,age:a,guardian:g,x:p.x,y:p.y,tx:t.x,ty:t.y,zone:z.n,tech:i%2?'BLE band':'BLE + NFC',code:code(4),allergy:i===2?'Peanuts':i===5?'Dairy':'',status:'in',alarm:false,lastTap:z.n+' door · '+now()};});
  S.sg.audit.unshift({t:now(),m:'You (Safeguarding officer) opened the live map'});
}
function startSafeguard(){
  initKids(); S.sg.wanderAt = Date.now()+14000; let fired=false;
  S.sg.timer=setInterval(()=>{
    S.sg.kids.forEach(k=>{
      if(k.status!=='in') return;
      const dx=k.tx-k.x, dy=k.ty-k.y; const d=Math.hypot(dx,dy);
      if(d<6){ const cur=zoneAt(k.x,k.y)||ZONES[0]; let z=cur.ok?cur:ZONES[1]; if(!k.wander && Math.random()<.18){ z=pick(ZONES.filter(q=>q.ok)); } if(!k.wander){ const t=ptIn(z); k.tx=t.x; k.ty=t.y; } }
      else { const s=Math.min(d, k.wander?16:11); k.x+=dx/d*s; k.y+=dy/d*s; }
      const z=zoneAt(k.x,k.y); if(z && z.n!==k.zone){ k.zone=z.n; if(!z.ok && !k.alarm){ raiseAlarm(k,z); } }
    });
    if(!fired && Date.now()>S.sg.wanderAt){ fired=true; wander(); }
    paintMap();
  }, 600);
}
function stopSafeguard(){ if(S.sg.timer){clearInterval(S.sg.timer);S.sg.timer=null;} }
function wander(id){ const k = id? S.sg.kids.find(x=>x.id===id) : pick(S.sg.kids.filter(x=>x.status==='in'&&!x.alarm)); if(!k) return; const ex=ZONES[4]; k.wander=true; k.tx=ex.x+ex.w/2; k.ty=ex.y+ex.h/2; }
function raiseAlarm(k,z){
  k.alarm=true; S.sg.alerts.unshift({id:k.id,t:now(),m:`${k.name} (${k.age}) entered ${z.n} without a paired guardian band`}); S.sg.ack=false;
  S.sg.audit.unshift({t:now(),m:`ALERT raised: ${k.name} at ${z.n}. Stewards and guardian (${k.guardian}) notified`});
  buzz(); announce(`Alert. ${k.name} has entered ${z.n}.`);
  if(route()==='safeguard') rerender();
}
function paintMap(){
  S.sg.kids.forEach(k=>{ const c=document.getElementById('dot-'+k.id); if(c){ c.setAttribute('transform',`translate(${k.x.toFixed(1)} ${k.y.toFixed(1)})`); }
    const z=document.getElementById('kz-'+k.id); if(z) z.textContent=k.status==='in'?k.zone:'Collected'; });
}

/* create */
A.ctype = el=>{ S.create.type=el.dataset.v; rerender(); };
A.ctpl = el=>{ const k=el.dataset.v, t=TPL[k], c=S.create; c.tpl=k; c.type=t.type; if(t.days) c.days=t.days; if(t.safe) c.safeguard=true; if(t.mode) c.mode=t.mode; toast(t.icon+' '+t.name+' template applied'); rerender(); };
A.cmode = el=>{ S.create.mode=el.dataset.v; rerender(); };
A.csafe = el=>{ S.create.safeguard=el.checked; };
A.autofill = ()=>{
  const c=S.create; const t=c.title||'Our celebration'; const place=c.venue||'the venue';
  const D={Seminar:[`${t}: a practical programme at ${place}. Tap your phone on the door sticker each morning to sign in, and rate every session in 30 seconds. Certificates are issued on completion.`,'Day 1  09:00 Tap-in · 09:30 Session 1 · 11:30 Session 2 · 14:00 Workshop\nDay 2  Same format\nDay 3  Sessions, then action planning and certificates'],
    'Inaugural lecture':[`You are cordially invited to the inaugural lecture "${t}" at ${place}. Academic procession at 10:00. A live captioned stream is available for guests who can’t attend.`,'10:00  Academic procession\n10:20  Citation of the lecturer\n10:40  Inaugural lecture\n12:00  Vote of thanks and reception'],
    'Funeral / remembrance':[`With love and gratitude, we celebrate the life of ${t.replace(/^(Funeral|Remembrance)( of)?\s*/i,'')||'our loved one'}. Family and friends abroad can join the livestream and leave a tribute in the condolence book.`,'Fri  Wake-keeping and service of songs\nSat 10:00  Funeral service\nSat 13:00  Interment (family only)\nSat 15:00  Reception'],
    Launch:[`Be first to see ${t} at ${place}. Press and VIP arrivals from 18:00, with the reveal at 19:00. Tap-in entry, so there's no queue.`,'18:00  Press and VIP arrivals\n18:45  Doors open\n19:00  The reveal\n19:30  Demos, drinks and music'],
    Wedding:[`We’re getting married! Join us at ${place} as we celebrate love, family and plenty of dancing. Colour of the day will be shared soon, and aso-ebi can be ordered in the RSVP form.`,'10:00  Traditional engagement\n12:30  Church service\n15:00  Reception: first dance, toasts, cake\n18:00  After-party'],
    Corporate:[`${t}: a focused session at ${place} with expert talks, practical takeaways and time to network. Breakfast and coffee included.`,'08:00  Registration & breakfast\n08:30  Keynote\n09:15  Panel: AI in the workplace\n10:00  Networking'],
    'Kids party':[`It’s party time! Games, face painting and cake at ${place}. Every child gets a safety wristband at the door, and parents get a matching pickup label.`,'14:00  Arrivals & wristbands\n14:30  Games & bouncy castle\n15:30  Cake & songs\n16:30  Pickup (show your label)']};
  const [d,a]=D[c.type]||[`Join us for ${t} at ${place}. Expect great company, good food and memories to share. RSVP so we can plan for you.`,'18:00  Doors open\n18:30  Welcome\n19:00  Main programme\n21:00  Close'];
  c.busy=true; c.desc=''; c.agenda=''; if(c.type==='Kids party') c.safeguard=true; rerender();
  if(S.a11y.rm){ c.desc=d; c.agenda=a; c.busy=false; rerender(); announce('Description and agenda filled in'); return; }
  let i=0; const iv=setInterval(()=>{ i+=4; c.desc=d.slice(0,i); const ta=$('#c-desc'); if(ta) ta.value=c.desc; if(i>=d.length){ clearInterval(iv); c.agenda=a; c.busy=false; rerender(); announce('Description and agenda filled in'); toast('✨ AI drafted your description and agenda'); } },18);
};
/* event tabs */
A.addcodes=()=>{};
A.gencodes = ()=>{ const o=S.codeOpts; const n=Math.max(1,Math.min(500,+o.count||10)); const p=(o.prefix||'').toUpperCase().replace(/[^A-Z0-9]/g,''); S.codes=Array.from({length:n},()=>(p?p+'-':'')+code(4)); S.codeSel=0; toast(`${n} codes generated`); rerender(); };
A.selcode = el=>{ S.codeSel=+el.dataset.v; rerender(); };
A.copycodes = async ()=>{ try{ await navigator.clipboard.writeText(S.codes.join('\n')); toast('Codes copied'); }catch(e){ toast('Copy isn’t allowed in this viewer'); } };
A.seatsel = el=>{ S.seatSel=+el.dataset.v; rerender(); };
A.seat = ()=>{ const id=$('#seatadd').value; const g=ev().guests.find(x=>x.id===id); if(g){ g.table=S.seatSel; toast(`${g.name} seated at Table ${S.seatSel}`);} rerender(); };
A.unseat = el=>{ const g=ev().guests.find(x=>x.id===el.dataset.v); if(g){g.table=0;} rerender(); };
A.autoseat = ()=>{ const yes=ev().guests.filter(g=>g.status==='yes'); const groups=[...new Set(yes.map(g=>g.group))]; let t=1,c=0; groups.forEach(gr=>yes.filter(g=>g.group===gr).forEach(g=>{ if(c>=8){t=Math.min(6,t+1);c=0;} g.table=t;c++; })); toast('✨ Guests seated by group'); rerender(); };
A.evsafe = el=>{ ev().safeguard=el.checked; toast(el.checked?'Safeguarding Mode on: guardians will be asked for consent':'Safeguarding Mode off'); };
/* studio */
A.stylepick = el=>{ S.studio.style=el.dataset.v; rerender(); };
A.generate = ()=>{
  if(S.credits<4){ return modal(`<h2 id="mtitle">You’re out of credits</h2><p>Top up 50 credits for ${S.region==='UK'?'£5':'₦3,000'}, or upgrade your plan.</p><div class="row"><button class="btn btn-primary" data-act="topup">Buy top-up</button><a class="btn" href="#pricing" data-act="closemodal">See plans</a></div>`); }
  const st=S.studio; st.busy=true; st.sel=-1; rerender();
  setTimeout(()=>{ const base=hash(st.prompt+st.style+Date.now()); const others=['Elegant','Vibrant','Minimal','Afro-pop'].filter(s=>s!==st.style);
    st.drafts=[0,1,2,3].map(i=>({seed:(base+i*97)%100000,style:i<2?st.style:others[i-1]})); st.busy=false; S.credits-=4; st.sel=0; st.vscene=0; setAlt(); rerender(); announce('4 drafts ready'); toast('✨ 4 drafts ready · 4 credits used'); }, 1400);
};
function setAlt(){ const e=ev(), d=S.studio.drafts[S.studio.sel]; const m={Elegant:'dark background, thin gold frame and serif lettering',Vibrant:'bright gradient with confetti and colourful circles',Minimal:'off-white background, a bold colour block and clean black type','Afro-pop':'bold Ankara-inspired zigzag pattern in warm colours'};
  S.studio.alt = `Invitation flyer for ${e.title}: ${m[d.style]}. Text reads “${e.title}” and “${e.date}”.`; }
A.seldraft = el=>{ stopVideo(); S.studio.sel=+el.dataset.v; S.studio.vscene=0; setAlt(); rerender(); };
A.vplay = ()=>{ const st=S.studio; if(st.vplaying){ stopVideo(); rerender(); return; }
  st.vplaying=true; st.vscene=0; const sc=scenes(); rerender(); try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(sc.map(s=>s.c).join(' ')); u.lang='en-GB'; speechSynthesis.speak(u);}catch(e){}
  vtimer=setInterval(()=>{ st.vscene++; if(st.vscene>=sc.length){ clearInterval(vtimer); vtimer=null; st.vplaying=false; st.vscene=sc.length-1; rerender(); return; } const v=$('#vid'); if(v) v.innerHTML=videoFrame(); },2600);
};
A.capt = el=>{ S.a11y.cap=el.checked; const v=$('#vid'); if(v) v.innerHTML=videoFrame(); };
A.genvideo = ()=>{ if(S.credits<15) return toast('Not enough credits: you need 15'); S.credits-=15; S.studio.gen=0; rerender(); toast('Video queued. We’ll notify you when it’s ready.');
  const iv=setInterval(()=>{ S.studio.gen=Math.min(100,S.studio.gen+Math.ceil(Math.random()*9)); if(S.studio.gen>=100){ clearInterval(iv); toast('🎬 Your AI video is ready'); buzz(); setTimeout(()=>{S.studio.gen=null; if(route()==='studio') rerender();},3000);} if(route()==='studio' && !S.studio.vplaying) rerender(); },450); };
A.usedraft = ()=>{ const d=S.studio.drafts[S.studio.sel]; const e=ev(); e.hue=d.seed; e.style=d.style; toast('Cover updated for '+e.title); };
A.clearupload = ()=>{ S.studio.upload=null; rerender(); };
A.topup = ()=>{ S.credits+=50; closeModal(); toast('+50 credits added (prototype, no charge)'); rerender(); };
A.plan = el=>{ const n=el.dataset.v; if(n==='Corporate') return toast('Sales will contact you within one working day (prototype)'); S.plan=n; S.credits=+el.dataset.c; toast(`Switched to ${n}`); rerender(); };
/* rsvp */
A.resp = el=>{ S.rsvp.resp=el.dataset.v; rerender(); };
A.plus = el=>{ S.rsvp.plus=Math.max(0,Math.min(5,S.rsvp.plus+ +el.dataset.v)); rerender(); };
A.qty = el=>{ S.rsvp.qty=Math.max(1,Math.min(10,S.rsvp.qty+ +el.dataset.v)); rerender(); };
A.tier = el=>{ S.rsvp.tier=+el.dataset.v; rerender(); };
A.pay = el=>{ S.rsvp.pay=el.dataset.v; rerender(); };
A.part = el=>{ S.rsvp.parts[el.dataset.v]=el.checked; };
A.need = el=>{ const n=el.dataset.v, a=S.rsvp.needs; const i=a.indexOf(n); i>=0?a.splice(i,1):a.push(n); el.setAttribute('aria-pressed',i<0); };
A.rsvpreset = ()=>{ S.rsvp.done=false; stopQR(); rerender(); };
let qrtimer=null; function stopQR(){ if(qrtimer){clearInterval(qrtimer);qrtimer=null;} }
function startQR(){ stopQR(); let s=30; qrtimer=setInterval(()=>{ if(route()!=='rsvp'||!S.rsvp.done){stopQR();return;} s--; const t=$('#qrtick'); if(t) t.textContent=s; if(s<=0){ s=30; S.rsvp.seed=Math.random(); const q=$('#liveqr'); if(q) q.innerHTML=qr(ev().id+S.rsvp.seed,190); } },1000); }
/* check-in */
A.ckmode = el=>{ S.ck.mode=el.dataset.v; rerender(); };
A.offline = el=>{ S.ck.offline=el.checked; if(!el.checked && S.ck.queue){ toast(`Synced ${S.ck.queue} queued check-ins`); S.ck.queue=0; } rerender(); };
function logScan(k,name,note,via){ const C=S.ck; C.last={k,name,note}; C.log.unshift({k,name,via,t:now()}); C.count++; if(C.offline&&k==='ok') C.queue++; buzz(); announce((k==='ok'?'Checked in ':k==='warn'?'Already checked in ':'Invalid ')+name); rerender(); }
function checkInRandom(via){ const e=ev(); const pool=e.guests.filter(g=>g.status==='yes'); const g=pick(pool); if(!g) return;
  if(g.checked) return logScan('warn',g.name,'First scanned earlier today', via);
  g.checked=true; logScan('ok',g.name,(g.plus?`+${g.plus} guest · `:'')+(g.table?'Table '+g.table:g.group)+(g.needs.length?' · ♿ '+g.needs[0]:''), via); }
A.scan = ()=>checkInRandom('QR');
A.ckday = el=>{ S.ck.day=+el.dataset.v; S.ck.welcome=null; S.ck.last=null; rerender(); };
A.tagtap = ()=>{ const e=ev(), d=S.ck.day; const pool=e.guests.filter(g=>g.status==='yes'); const free=pool.filter(g=>!(g.att&&g.att[d])); const g=free.length?pick(free):pick(pool); if(!g) return;
  g.att=g.att||{}; if(g.att[d]){ S.ck.welcome=null; return logScan('warn',g.name,'Already tapped in today','Phone tap'); }
  const first=!Object.keys(g.att).length; g.att[d]=true; if(d===0) g.checked=true;
  const tm=['08:41','08:52','09:03','09:12','09:27'][Math.floor(Math.random()*5)]; S.ck.welcome={name:g.name,first};
  logScan('ok',g.name,(e.multi?(e.parts[d]+' · '):'')+'tapped in at '+tm+(tm>'09:30'?' (late)':' (on time)')+' · welcome message sent','Phone tap'); };
A.geo = ()=>{ try{ if(!navigator.geolocation) throw 0; navigator.geolocation.getCurrentPosition(()=>toast('📍 Using your location for directions'),()=>toast('Location isn’t allowed in this preview, so a sample starting point is used')); }catch(e){ toast('Location isn’t available here, so a sample starting point is used'); } };
A.setsong = ()=>{ const v=($('#songin').value||'').trim(); ev().song=v; toast(v?'🎵 Song added to the invitation':'Song removed'); rerender(); };
A.scanbad = ()=>logScan('bad','Unknown code','This code was cancelled or belongs to a different event','QR');
A.manualin = el=>{ const g=ev().guests.find(x=>x.id===el.dataset.v); if(g){ g.checked=true; logScan('ok',g.name,g.group,'Manual'); } };
A.nfcread = async ()=>{
  if('NDEFReader' in window){ try{ const r=new NDEFReader(); await r.scan(); toast('Ready: tap a wristband'); r.onreading=()=>checkInRandom('NFC'); return; }catch(err){ toast('NFC isn’t allowed in this viewer. Simulating a tap.'); } }
  setTimeout(()=>checkInRandom('NFC'),500);
};
A.nfcwrite = async ()=>{ const v=$('#encsel')&&$('#encsel').value; if(!v) return toast('Nothing to write');
  if('NDEFReader' in window){ try{ const w=new NDEFReader(); toast('Hold the wristband to the phone…'); await w.write({records:[{recordType:'text',data:'GW:'+ev().id+':'+v}]}); toast('✓ Wristband written: '+v); buzz(); return; }catch(err){ toast('NFC isn’t allowed in this viewer. Simulating the write.'); } }
  setTimeout(()=>{ toast('✓ Wristband encoded with '+v+' (simulated)'); buzz(); },700); };
/* safeguarding */
A.wander = el=>{ wander(el.dataset.v); toast('Simulating: a child heads towards Exit A…'); };
A.focus = el=>{ S.sg.focus=el.dataset.v; S.sg.audit.unshift({t:now(),m:'Officer viewed '+S.sg.kids.find(k=>k.id===el.dataset.v).name+'’s location'}); rerender(); };
A.locate = el=>{ S.sg.focus=el.dataset.v; rerender(); toast('Nearest steward dispatched to Exit A'); };
A.ack = el=>{ const k=S.sg.kids.find(x=>x.id===el.dataset.v); k.alarm=false; k.wander=false; const z=ZONES[1]; const t=ptIn(z); k.tx=t.x; k.ty=t.y; S.sg.ack=true; S.sg.audit.unshift({t:now(),m:`${k.name} found safe and returned to Kids Zone. Incident closed`}); toast(`${k.name} marked safe`); rerender(); };
A.verify = ()=>{ const id=$('#pk-kid').value, c=($('#pk-code').value||'').trim().toUpperCase(); const k=S.sg.kids.find(x=>x.id===id); if(!k) return;
  if(c===k.code){ k.status='out'; S.sg.verify={ok:true,m:`${k.name} released to ${k.guardian} at ${now()}. Wristband deactivated.`}; S.sg.audit.unshift({t:now(),m:`${k.name} collected by ${k.guardian} (code matched)`}); }
  else { S.sg.verify={ok:false,m:`Don’t release ${k.name}. Ask for photo ID and call a safeguarding officer.`}; S.sg.audit.unshift({t:now(),m:`Failed pickup attempt for ${k.name} (code mismatch)`}); buzz(); }
  rerender(); };

/* ---------- Delegated events ---------- */
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act; if(!A[a]) return;
  if(el.tagName==='INPUT' && el.type==='checkbox'){ A[a](el,e); return; }
  if(el.tagName==='A' && a!=='a11y' && a!=='closemodal'){ /* links navigate normally */ }
  if(a!=='closemodal-bg') e.preventDefault(); A[a](el,e); if(a==='closemodal' && el.getAttribute('href')) location.hash=el.getAttribute('href').slice(1); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#modalroot').innerHTML) closeModal();
  if((e.key==='Enter'||e.key===' ') && e.target.matches('article[data-act]')){ e.preventDefault(); A[e.target.dataset.act](e.target,e); } });
document.addEventListener('input',e=>{ const el=e.target;
  if(el.dataset.bind){ const [o,k]=el.dataset.bind.split('.'); S[o][k]=el.value; if(o==='create' && (k==='title'||k==='venue')){ /* live preview without losing focus */ clearTimeout(window._pv); window._pv=setTimeout(()=>{ const id=el.id, pos=el.selectionStart; rerender(); const n=document.getElementById(id); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(x){} } },450); } }
  const ia=el.dataset.actInput;
  if(ia==='gsearch'||ia==='msearch'){ const q=el.value.toLowerCase(); document.querySelectorAll(ia==='gsearch'?'#glist li':'#mlist li').forEach(li=>li.style.display=li.dataset.q.includes(q)?'':'none'); }
  if(ia==='feecalc'){ $('#feeout').innerHTML=feeTable(el.value); }
});
document.addEventListener('change',e=>{ const el=e.target; const a=el.dataset.actChange;
  if(el.dataset.bind && el.tagName==='SELECT'){ const [o,k]=el.dataset.bind.split('.'); S[o][k]=el.value; }
  if(a==='fbsession'){ S.fb.session=el.value; S.fb.qs=[]; S.fb.ans={}; rerender(); }
  if(a==='pickev'){ S.cur=el.value; S.codes=[]; S.rsvp={resp:'yes',plus:0,parts:{},needs:[],tier:0,qty:1,pay:null,done:false,size:'M'}; rerender(); }
  if(a==='upload'){ const f=el.files&&el.files[0]; if(f){ S.studio.upload={url:URL.createObjectURL(f),type:f.type||'image/'}; toast('Upload added to the event gallery'); rerender(); } }
});
document.addEventListener('submit',e=>{ e.preventDefault(); const f=e.target;
  if(f.id==='createform'){ const c=S.create; if(!c.title.trim()){ toast('Please add an event title'); $('#c-title').focus(); return; }
    const id='ev'+Date.now(); const st=(c.type==='Wedding'||c.type==='Funeral / remembrance'||c.type==='Church')?'Elegant':['Corporate','Conference','Seminar','Inaugural lecture'].includes(c.type)?'Minimal':(c.type==='Concert'||c.type==='Launch')?'Afro-pop':'Vibrant';
    S.events.unshift({id,title:c.title,type:c.type,date:c.date?new Date(c.date).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'Date to be confirmed',time:'18:00',venue:c.venue||'Venue to be confirmed',city:S.region==='UK'?'UK':'Nigeria',region:S.region,hue:hash(c.title)%360,style:st,
      mode:c.mode==='both'?'tickets':c.mode,multi:(+c.days>1),recur:c.recur!=='none'?c.recur:'',template:c.tpl,parts:(+c.days>1)?Array.from({length:+c.days},(_,i)=>'Day '+(i+1)):c.type==='Wedding'?['Traditional engagement','Church service','Reception']:c.type==='Funeral / remembrance'?['Wake-keeping','Funeral service','Interment','Reception']:[],tickets:c.mode==='rsvp'?[]:(S.region==='UK'?[{name:'General',price:20,sold:0,cap:100},{name:'VIP',price:50,sold:0,cap:20}]:[{name:'Regular',price:10000,sold:0,cap:300},{name:'VIP',price:40000,sold:0,cap:50}]),
      safeguard:c.safeguard,desc:c.desc||'Details coming soon.',guests:[]});
    S.cur=id; S.tab='overview'; S.create={title:'',type:'Wedding',date:'',venue:'',mode:'rsvp',safeguard:false,desc:'',agenda:'',busy:false,tpl:'',days:1,recur:'none'}; toast('🎉 Event created'); location.hash='event'; }
  if(f.id==='rsvpform'){ const e2=ev(); if(e2.mode==='tickets' && !S.rsvp.pay){ toast('Choose how you’d like to pay'); return; }
    S.rsvp.done=true; S.rsvp.seed=Math.random(); S.rsvp.code=code(6);
    if(e2.mode==='tickets'){ e2.tickets[S.rsvp.tier].sold=Math.min(e2.tickets[S.rsvp.tier].cap,e2.tickets[S.rsvp.tier].sold+S.rsvp.qty); }
    rerender(); window.scrollTo(0,0); startQR(); announce(e2.mode==='tickets'?'Payment successful. Your ticket is ready.':'RSVP confirmed'); }
  if(f.id==='addgform'){ const n=$('#ag-n').value.trim(); if(!n) return; ev().guests.unshift({id:'g'+Date.now(),name:n,status:'pending',plus:0,needs:[],table:0,code:code(6),checked:false,group:'Added',color:pick(COLORS)}); closeModal(); toast('Invite sent to '+n); rerender(); }
});

applyA11y();
if(!location.hash) history.replaceState(null,'','#home');
render(false);
</script>
</body>
</html>
