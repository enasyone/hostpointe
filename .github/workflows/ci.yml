# CI (continuous integration): runs on every pull request and on pushes to main.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Package boundary rules (ADR-0001); needs build first
        run: pnpm lint:boundaries
  tests:
    name: Codex tests (unit, accessibility)
    runs-on: ubuntu-latest
    needs: quality
    # Row-level security tests need a real PostgreSQL 18 with NON-superuser logins (superusers bypass RLS).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: bootstrap_local_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hostpointe_api:api_local_only@localhost:5432/hostpointe
      MIGRATION_DATABASE_URL: postgresql://hostpointe_owner:owner_local_only@localhost:5432/hostpointe
      PURGE_DATABASE_URL: postgresql://hostpointe_purge_job:purge_local_only@localhost:5432/hostpointe
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Create database roles (same script as local Docker Compose)
        run: |
          sudo apt-get install -y postgresql-client >/dev/null
          PGPASSWORD=bootstrap_local_only POSTGRES_USER=postgres PGHOST=localhost sh infra/local/init-roles.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply database migrations (owner login, direct)
        run: pnpm --filter @hostpointe/database migrate:up
      - run: pnpm test
  security:
    name: security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fails on high or critical)
        run: pnpm audit --audit-level high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Static analysis (CodeQL) init
        uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
  bicep:
    name: validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all Bicep templates (no deployment)
        run: |
          shopt -s nullglob
          for f in infra/*.bicep infra/**/*.bicep; do az bicep build --file "$f" --stdout > /dev/null; done
